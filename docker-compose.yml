# GitHub-hosted packages (@teenguyen/nook-phone): set NPM_TOKEN in the environment
# or in a local `.env` file (Compose loads it — do not commit tokens).
# Use a GitHub PAT with the `read:packages` scope (classic) or SSO-authorized fine-grained token.

services:
  app:
    build:
      context: .
      secrets:
        - npm_token
    ports:
      - "${APP_PORT:-3000}:3000"
    develop:
      watch:
        - action: sync
          path: .
          target: /app
          ignore:
            - node_modules/
            - .next/
            - .git/
        - action: rebuild
          path: package.json
        - action: rebuild
          path: pnpm-lock.yaml

secrets:
  npm_token:
    environment: NPM_TOKEN
